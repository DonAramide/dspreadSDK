plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.hilt.plugin)
    alias(libs.plugins.ksp)
}

configurations.configureEach {
    resolutionStrategy {
        // Force all BouncyCastle dependencies to use the newer version
        force 'org.bouncycastle:bcprov-jdk18on:1.80'
        force 'org.bouncycastle:bcpkix-jdk18on:1.80'
        force 'org.bouncycastle:bcutil-jdk18on:1.80'

        // Explicitly exclude the older version
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
        exclude group: 'org.bouncycastle', module: 'bcutil-jdk15on'
    }
}

// Exclude BouncyCastle from Pos-DSpread module
configurations.all {
    exclude group: 'org.bouncycastle', module: 'bcprov'
    exclude group: 'org.bouncycastle', module: 'bcpkix'
    exclude group: 'org.bouncycastle', module: 'bcutil'
}

android {
    namespace 'com.dspreadbaseapp.baseapp'
    signingConfigs {
        release {
            storeFile file('app.keystore')
            storePassword 'dspread'
            keyPassword 'dspread'
            keyAlias 'gundam_wing'
            /*storeFile file('sys.keystore')
            storePassword 'dspread'
