            keyAlias 'system'*/
        }
        debug {
            storeFile file('app.keystore')
            storePassword 'dspread'
            keyPassword 'dspread'
            keyAlias 'gundam_wing'
            /*storeFile file('sys.keystore')
            storePassword 'dspread'
            keyPassword 'dspread'
            keyAlias 'system'*/
        }
        config {
            keyAlias 'key0'
            keyPassword '123789'
            storeFile file('dspread.jks')
            storePassword '123789'
        }
    }

    defaultConfig {
        applicationId "com.dspreadbaseapp.baseapp"
        versionCode 1
        versionName "1.0.0"
        
        // Enable multidex to handle large number of methods
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Handle duplicate classes in release builds
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        pickFirst 'META-INF/services/javax.crypto.Cipher'
        pickFirst 'META-INF/services/org.bouncycastle.jce.provider.BouncyCastleProvider'
        pickFirst '**/org/bouncycastle/**'
        pickFirst '**/org/bouncycastle/pqc/asn1/PQCObjectIdentifiers.class'
        pickFirst '**/org/bouncycastle/jcajce/util/AlgorithmParametersUtils.class'
    }

    // Configure build features
    buildFeatures {
        buildConfig true
    }

    // Handle duplicate classes at build level
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

